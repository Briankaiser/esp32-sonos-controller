; ESP32-S3 Sonos Controller
; Two build environments — one per board. Both must always compile.
;   pio run -e crowpanel_21_round
;   pio run -e ref_rect_stub

[platformio]
default_envs = crowpanel_21_round

; ── Common lib_deps (shared by all envs) ──────────────────────────────────────

[libs]
lib_deps =
    lvgl/lvgl @ ^9.2.0
    moononournation/GFX Library for Arduino @ ^1.4.9
    robtillaart/PCF8574 @ ^0.4.0
    bitbank2/JPEGDEC @ ^1.8.4
    ; CST816 touch: direct I2C reads in board.cpp — no library needed

; ── Primary board: Elecrow CrowPanel 2.1" 480x480 round ───────────────────────

[env:crowpanel_21_round]
; pioarduino platform ships Arduino ESP32 core 3.x (IDF 5.x), which is required
; by GFX Library for Arduino 1.4.x (uses esp_rgb_panel_t / esp_lcd APIs from IDF 5).
; 55.03.311 = Arduino 3.3.11, IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32s3box
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000
monitor_speed = 115200
upload_speed = 921600

extends = libs

build_src_filter =
    +<*>
    -<bsp/*/>
    +<bsp/crowpanel_21_round/>

; build_unflags removes the core's default older C++ standard before we set C++17
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14

build_flags =
    -std=gnu++17
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DOPENSONOS_DEBUG_OVERLAY=0
    -I src/bsp/crowpanel_21_round
    -I lib
    -DOPENSONOS_BOARD_SELECTED
    -DOPENSONOS_SHAPE_ROUND

extra_scripts = extra_scripts/exclude_arm_asm.py

; ── Reference board: 800x480 rectangular stub (must compile; may not run) ─────

[env:ref_rect_stub]
; pioarduino platform ships Arduino ESP32 core 3.x (IDF 5.x), which is required
; by GFX Library for Arduino 1.4.x (uses esp_rgb_panel_t / esp_lcd APIs from IDF 5).
; 55.03.311 = Arduino 3.3.11, IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32s3box
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

extends = libs

build_src_filter =
    +<*>
    -<bsp/*/>
    +<bsp/ref_rect_stub/>

build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14

build_flags =
    -std=gnu++17
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DOPENSONOS_DEBUG_OVERLAY=0
    -I src/bsp/ref_rect_stub
    -I lib
    -DOPENSONOS_BOARD_SELECTED
    -DOPENSONOS_SHAPE_RECT

extra_scripts = extra_scripts/exclude_arm_asm.py

; ── Host unit tests (no hardware required) ────────────────────────────────────
; Compiles pure-logic modules under the host compiler and runs Unity tests.
; Usage: pio test -e test_native

[env:test_native]
platform = native
build_flags =
    -std=gnu++17
    -I src
    -I src/bsp/crowpanel_21_round
    -I test/host/stubs
    -DOPENSONOS_BOARD_SELECTED
    -DOPENSONOS_SHAPE_ROUND
    -DNATIVE_TEST
; Only compile the pure-logic modules from src/ — no BSP, no LVGL rendering
build_src_filter =
    +<ui/layout/layout.cpp>
    +<ui/theme/accent.cpp>
    +<ui/theme/fonts.cpp>
    +<app/sonos/xml_util.cpp>
    +<app/sonos/gena_parse.cpp>
test_build_src = yes
test_filter = host/*

; ── On-device integration tests ───────────────────────────────────────────────
; Inherits the primary board settings and flashes a test image via USB.
; Usage: pio test -e test_device   (requires CrowPanel connected)

[env:test_device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32s3box
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
extends = libs
build_src_filter =
    +<*>
    -<bsp/*/>
    +<bsp/crowpanel_21_round/>
build_unflags = -std=gnu++11 -std=gnu++14 -std=c++11 -std=c++14
build_flags =
    -std=gnu++17
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DOPENSONOS_DEBUG_OVERLAY=0
    -I src/bsp/crowpanel_21_round
    -I lib
    -DOPENSONOS_BOARD_SELECTED
    -DOPENSONOS_SHAPE_ROUND
extra_scripts = extra_scripts/exclude_arm_asm.py
test_speed = 115200
test_filter = device/*
